<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">João Vilela — Desenvolvimento full stack, IA aplicada e automação</title>
  <desc id="desc">Banner azul-escuro e dourado com circuito animado. Aberto a oportunidades no Brasil.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080e22"/><stop offset=".55" stop-color="#101d3c"/><stop offset="1" stop-color="#09132d"/></linearGradient>
    <linearGradient id="gold"><stop stop-color="#fff1c7"/><stop offset=".5" stop-color="#efc36b"/><stop offset="1" stop-color="#cf9141"/></linearGradient>
    <linearGradient id="trace"><stop stop-color="#efc36b" stop-opacity=".08"/><stop offset=".5" stop-color="#efc36b"/><stop offset="1" stop-color="#7ac9dd" stop-opacity=".5"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#384a79" stop-opacity=".65"/><stop offset="1" stop-color="#101d3c" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#b3c5ec" stroke-opacity=".045"/></pattern>
    <clipPath id="frame"><rect width="1200" height="360" rx="20"/></clipPath>
    <clipPath id="name"><text x="64" y="150" font-family="Arial, sans-serif" font-size="64" font-weight="800" letter-spacing=".4">JOÃO VILELA</text></clipPath>
    <linearGradient id="shine"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff9e6" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <style>@media (prefers-reduced-motion: reduce) { .motion { display: none; } }</style>
  <g clip-path="url(#frame)">
