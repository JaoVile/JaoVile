      <circle r="3"><animateMotion path="M920 207L862 267H810" dur="7s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" begin="2s" repeatCount="indefinite"/></circle>
    </g>
    <text x="968" y="312" text-anchor="middle" font-family="Arial, sans-serif" fill="#8296bb" font-size="11" letter-spacing="3">CONTEXTO · CÓDIGO · SOLUÇÕES</text>
